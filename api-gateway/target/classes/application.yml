server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Define explicit routes for each microservice
      routes:

        # ---- Swagger / API-Docs pass-through routes (no JWT) ----
        - id: auth-service-docs
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: expense-service-docs
          uri: lb://EXPENSE-SERVICE
          predicates:
            - Path=/expense-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: category-service-docs
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/category-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: budget-service-docs
          uri: lb://BUDGET-SERVICE
          predicates:
            - Path=/budget-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: report-service-docs
          uri: lb://REPORT-SERVICE
          predicates:
            - Path=/report-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: notification-service-docs
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # Auth Service routes (public - no JWT needed)
        - id: auth-service-public
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/login, /api/auth/register
          filters:
            - StripPrefix=0

        # Auth Service routes (protected)
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationFilter

        # Expense Service
        - id: expense-service
          uri: lb://EXPENSE-SERVICE
          predicates:
            - Path=/api/expenses/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationFilter

        # Category Service
        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationFilter

        # Budget Service
        - id: budget-service
          uri: lb://BUDGET-SERVICE
          predicates:
            - Path=/api/budgets/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationFilter

        # Report Service
        - id: report-service
          uri: lb://REPORT-SERVICE
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationFilter

        # Notification Service - internal /send endpoint (no JWT, called by expense-service Feign)
        - id: notification-service-internal
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/send
          filters:
            - StripPrefix=0

        # Notification Service - all other endpoints require JWT
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**, /ws/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationFilter

      # Global CORS configuration
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders: "Authorization"
            allowCredentials: true
            maxAge: 3600

# Eureka Client - gateway registers itself and discovers other services
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    hostname: localhost
    preferIpAddress: false
    instance-id: ${spring.application.name}:${server.port}
    status-page-url: http://localhost:${server.port}/actuator/info
    health-check-url: http://localhost:${server.port}/actuator/health
    home-page-url: http://localhost:${server.port}/


# JWT Secret - MUST match what auth-service uses
jwt:
  secret: ${JWT_SECRET:SpendWise-Super-Secret-Key-That-Is-At-Least-256-Bits-Long-For-Security}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: SpendWise API Gateway
    description: Central entry point routing requests to all microservices with JWT validation
    version: 1.0.0
    port: 8080
  services:
    auth-service: http://localhost:8081/swagger-ui.html
    expense-service: http://localhost:8082/swagger-ui.html
    category-service: http://localhost:8083/swagger-ui.html
    budget-service: http://localhost:8084/swagger-ui.html
    report-service: http://localhost:8085/swagger-ui.html
    notification-service: http://localhost:8086/swagger-ui.html
  aggregated-swagger: http://localhost:8080/swagger-ui.html


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    persist-authorization: true
    display-request-duration: true
    # Aggregated view — one Swagger UI showing all 6 services
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: expense-service
        url: /expense-service/v3/api-docs
      - name: category-service
        url: /category-service/v3/api-docs
      - name: budget-service
        url: /budget-service/v3/api-docs
      - name: report-service
        url: /report-service/v3/api-docs
      - name: notification-service
        url: /notification-service/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.spendwise.gateway: DEBUG
